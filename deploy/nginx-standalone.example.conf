# Example: reverse-proxy Toollabz Next.js standalone (Node) behind nginx.
#
# CRITICAL (2026-07 ERR_SSL_PROTOCOL_ERROR postmortem):
# - TLS terminates on nginx :443 only.
# - Node listens on 127.0.0.1:3000 with PLAIN HTTP.
# - Always set X-Forwarded-Proto $scheme so the app knows the public request was HTTPS.
# - Never expose :3000 publicly. Never redirect browsers to https://domain:3000/.
#
# Root cause of “unstyled HTML” is often nginx serving / from disk OR stripping /_next/static.
# Fix: proxy ALL paths (including /_next/static/*) to the Node listener unless you intentionally offload static to CDN.

upstream toollabz_node {
  server 127.0.0.1:3000;
  keepalive 32;
}

# HTTP → HTTPS (nginx owns this; do not rely on Next middleware for scheme upgrade)
server {
  listen 80;
  listen [::]:80;
  server_name toollabz.com www.toollabz.com;
  return 301 https://toollabz.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.toollabz.com;

  # ssl_certificate /etc/letsencrypt/live/toollabz.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/toollabz.com/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://toollabz.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name toollabz.com;

  # ssl_certificate /etc/letsencrypt/live/toollabz.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/toollabz.com/privkey.pem;
  # include /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 25m;

  # Do NOT add: location /_next/static { root /var/www/html; } unless that path mirrors
  # .next/standalone/.next/static — otherwise CSS/JS 404 and the site is unstyled.

  location / {
    proxy_pass http://toollabz_node;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_redirect off;
    proxy_read_timeout 300s;
  }
}
